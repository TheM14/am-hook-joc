name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Validate the JOC patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Core tests and HRTF regressions
        run: |
          cd joc-wasm
          cargo test -p joc-core --verbose

      - name: Offline fixture (WASM + native)
        run: |
          OUT="$PWD/joc.wasm" bash scripts/build-joc-wasm.sh
          node tests/offline_joc.mjs --wasm joc.wasm
          (cd joc-wasm && cargo build --release -p joc-cli)
          python tests/native_fixture.py --cli joc-wasm/target/release/joc-cli

  source:
    name: Patched source archive
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Prepare upstream source with the patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_tool.py prepare --tag "$TAG" --dir am-hook --check-release
          OUT="$PWD/joc.wasm" bash scripts/build-joc-wasm.sh
          cp joc.wasm am-hook/src/ui/joc.wasm

      - name: Package the full applied source
        run: |
          python scripts/release_tool.py package-source --tag "$TAG" --build am-hook --out assets

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: joc.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: assets/*

  build:
    name: Build ${{ matrix.name }}
    needs: [test, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare upstream source with the patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_tool.py prepare --tag "$TAG" --dir am-hook --check-release

      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: wasm

      - name: Install the renderer built by the source job
        shell: bash
        run: cp wasm/joc.wasm am-hook/src/ui/joc.wasm

      - name: Build player
        shell: bash
        run: |
          cd am-hook
          cargo build --release --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          mkdir -p assets
          name="am-hook-joc-$TAG-${{ matrix.name }}"
          bin="am-hook/target/${{ matrix.target }}/release/am-hook"
          if [ "${{ matrix.name }}" = "windows-x86_64" ]; then
            cp "$bin.exe" "assets/$name.exe"
          else
            cp "$bin" "assets/$name"
            chmod +x "assets/$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: assets/*

  publish:
    name: Publish release
    needs: [source, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Add the standalone patch and checksums
        run: |
          cp patches/am-hook-joc.patch assets/am-hook-joc.patch
          cd assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish and verify assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_tool.py publish --tag "$TAG" --assets assets
