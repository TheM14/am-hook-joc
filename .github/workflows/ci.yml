name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  joc-core:
    name: JOC core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joc-wasm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            joc-wasm/target
          key: ${{ runner.os }}-joc-core-${{ hashFiles('joc-wasm/Cargo.lock') }}

      - name: Unit and parser tests
        run: cargo test -p joc-core --verbose

      - name: Release tool self-test
        working-directory: .
        run: python scripts/release_tool.py --self-test

  offline-render:
    name: Offline JOC fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build joc.wasm
        run: |
          OUT="$PWD/joc.wasm" bash scripts/build-joc-wasm.sh

      - name: Fixture regression (speaker, binaural, all HRTF fields)
        run: |
          node tests/offline_joc.mjs --wasm joc.wasm
          (cd joc-wasm && cargo build --release -p joc-cli)
          python tests/native_fixture.py --cli joc-wasm/target/release/joc-cli

  patch-build:
    name: Patch + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Resolve the latest upstream release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(python scripts/release_tool.py latest-upstream)
          echo "checking upstream $tag"
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"

      - name: Prepare upstream source with the patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_tool.py prepare --tag "$UPSTREAM_TAG" --dir am-hook --check-release

      - name: Build the renderer and the player
        shell: bash
        run: |
          OUT="$PWD/am-hook/src/ui/joc.wasm" bash scripts/build-joc-wasm.sh
          cd am-hook
          cargo build --release

      - name: Upstream library tests
        shell: bash
        run: |
          cd am-hook
          cargo test --lib
