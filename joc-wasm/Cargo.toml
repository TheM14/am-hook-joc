[workspace]
resolver = "2"
members = ["crates/joc-core", "crates/joc-wasm", "crates/joc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
